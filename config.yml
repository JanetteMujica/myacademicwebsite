    title: Janette Mujica
    subtitle: I am a first-year [PhD student in Digital Transformation and Innovation](https://dtiuottawa.ca/student/janette-mujica/) at the University of Ottawa. I study how patients, clinicians, and engineers co-design AI self-care chatbots for chronic conditions. My goal is to help those developing AI technologies meaningfully include end users to align with their best interests. <br><br> I am fortunate to be supervised by Professor [Sylvie Grosjean](https://uniweb.uottawa.ca/view/profile/members/721), and to have Professors [Lysanne Lessard](https://telfer.uottawa.ca/en/directory/lysanne-lessard/) and [Mayur Joshi](https://telfer.uottawa.ca/en/directory/mayur-joshi/) on my doctoral committee, whose expertise spans socio-technical design, digitally enabled services and technology & organizing.
    bio:
      Since fall 2024, I have worked as a research assistant at the Com&Tech Innovation Lab, directed by [Sylvie Grosjean](https://uniweb.uottawa.ca/view/profile/members/721), codesigning self-care technologies for people living with Parkinson’s. I have gained experience in qualitative research, participatory design and prototyping, transforming qualitative insights into tangible outcomes.<br><br> Alongside my master's and doctoral studies in Digital Transformation and Innovation, I completed training in Innovation Management at HEC Montréal, Digital Humanities and Computer Science at Université de Montréal. Before academia, I worked for more than a decade as an executive assistant within consulting, legal, financial organizations which have enhanced my ability and curiosity to work across different professional cultures.<br><br>

      This has allowed me to study the social and technical aspects of AI systems, such AI chatbots that are becoming increasingly popular in healthcare. For example, people, especially those living in underserved rural areas or seeking information outside regular clinic hours, are reported to use ChatGPT for health-related questions ([OpenAi, 2026](https://cdn.openai.com/pdf/2cb29276-68cd-4ec6-a5f4-c01c5e7a36e9/OpenAI-AI-as-a-Healthcare-Ally-Jan-2026.pdf)). At the same time, health professionals are raising concerns about the risks associated with inaccurate or unreliable information. This issue is especially important in Canada, where approximately 44% of adults aged 20 years and older live with at least one chronic condition ([Public Health Agency of Canada 2019](https://www.canada.ca/en/public-health/services/chronic-diseases/prevalence-canadian-adults-infographic-2019.html)). As people live longer with chronic conditions, the growing volume and complexity of care needs strains healthcare systems ([OECD, 2026](https://doi.org/10.1787/e20cbbc3-en)). <br><br>

      Some people are optimistic that AI chatbots can complement care and reduce the burden of chronic conditions on healthcare systems. However, others are raising concerns that patients may be consulted but excluded from meaningful participation in AI tool codesign and governance, not aligning with their best interests.
