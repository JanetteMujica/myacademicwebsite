      description: "Ce site présente les publications, les contributions et l'expérience d'enseignement de Janette Mujica."
      profileMode:
        enabled: true
        title: Janette Mujica
        subtitle: Je suis étudiante au [doctorat en transformation numérique et innovation](https://www.uottawa.ca/graduate-studies/programs/doctoral-programs/digital-transformation-and-innovation) à l'Université d'Ottawa. J'étudie la manière dont les patients, les cliniciens et les ingénieurs cocréent des chatbots d'IA destinés à l'autosoin des maladies chroniques. Je cherche à éclaircir la manière dont les développeurs des technologies d'IA peuvent inclure les utilisateurs finaux afin que celles-ci répondent à leurs meilleurs intérêts. <br><br> J'ai la chance d'être supervisée par la professeure [Sylvie Grosjean](https://uniweb.uottawa.ca/view/profile/members/721), et de compter parmi les membres de mon comité les professeurs [Lysanne Lessard](https://telfer.uottawa.ca/en/directory/lysanne-lessard/) et [Mayur Joshi](https://telfer.uottawa.ca/en/directory/mayur-joshi/). Leurs expertises couvrent la conception sociotechnique et des services numériques ainsi que les liens technologies & organisations.
        bio:
          Depuis l'automne 2024, je travaille comme assistante de recherche au Com&Tech Innovation Lab, dirigé par la professeure [Sylvie Grosjean](https://uniweb.uottawa.ca/view/profile/members/721), où je participe au codesign de technologies d'autosoin destinées aux personnes vivant avec la maladie de Parkinson. J'ai développé des compétences en recherche qualitative, en conception participative et en prototypage pouvant transformer les enseignements-clés issus de la recherche en résultats concrets.<br><br> Avant mes études en transformation numérique et innovation, j'ai étudié la gestion de l'innovation à HEC Montréal et les humanités numériques et l'informatique à l'Université de Montréal. J'ai également travaillé pendant plus de dix ans comme adjointe de direction dans le secteur de la consultation en management, droit et finance, ce qui m'a permis de développer ma capacité à collaborer avec des professionnels aux priorités parfois divergentes dans des cultures organisationnelles différentes.<br><br>

          Mes recherches portent sur les chatbots d'IA, qui gagnent en popularité en santé et sont un phénomène sociotechnique. Certaines personnes utilisent des chatbots pour obtenir des réponses à leurs questions de santé, notamment celles vivant en zone rurale ou cherchant des informations en dehors des heures d'ouverture des cliniques. Cependant, des professionnels de la santé s'inquiètent de la diffusion d'information peu fiable. Cette question est importante au Canada, où environ 44 % des adultes de 20 ans et plus vivent avec une maladie chronique.<br><br>

          Alors que les personnes vivent plus longtemps avec ces maladies, les systèmes de santé font face à une demande croissante de services. Certains voient dans les chatbots d'IA une solution pour alléger la pression. D'autres s'inquiètent toutefois du fait que les utilisateurs finaux, notamment les patients, ne soient pas véritablement impliqués dans leur développement et leur gouvernance, ce qui nuit à leurs meilleurs intérêts.
