baseURL: 'https://janettemujica.github.io/myacademicwebsite/'
theme: PaperMod

# ==========================================================================
# MULTILINGUAL SETUP
# - English is the default language and stays at the site root (/).
# - French lives under /fr/ (defaultContentLanguageInSubdir: false means
#   the default language, English, gets NO language prefix in its URLs).
# - For every content page you want translated, create a sibling file
#   with the ".fr.md" suffix (e.g. archive.md -> archive.fr.md). Hugo
#   pairs them automatically because they share the same translationKey
#   (the filename minus the language code).
# - Non-Markdown resources inside a page bundle (images, PDFs, etc. that
#   have NO language code in their filename) are automatically shared
#   between the English and French versions of that page, so you do NOT
#   need to duplicate paper1.pdf, paper1.png, etc.
# ==========================================================================
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableInlineShortcodes: true
enableRobotsTXT: true

pagination:
  pagerSize: 20

taxonomies:
  tag: tags

# --------------------------------------------------------------------------
# Per-language configuration: title, main menu, and PaperMod's "profile
# mode" (name / subtitle / bio / buttons on the home page) all differ by
# language, so they live inside each languages.<code> block instead of
# the shared "params:" block further down.
# --------------------------------------------------------------------------
languages:
  en:
    languageName: English
    languageCode: en-us
    weight: 1
    title: Janette Mujica
    menu:
