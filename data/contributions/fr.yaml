- date: Juil 2025
  type: Projet de session
  title: CAFY - un système conversationnel de recommandation en matière d’autosoins pour les personnes vivant avec la maladie de Parkinson
  description: Dans le cadre du cours sur les applications de la science des données, enseigné par le  [professeur Arya Rahgozar](https://www.uottawa.ca/faculty-engineering/school-engineering-design-teaching-innovation/directory/arya-rahgozar), [Wen Qi](https://www.linkedin.com/in/wenqi-debugging/), [Anna Shatalova](https://www.linkedin.com/in/anna-shatalova-309b77167/), et moi avons conçu un prototype de CAFY, un système conversationnel de recommandation en matière d’autosoins destiné aux personnes vivant avec la maladie de Parkinson.
