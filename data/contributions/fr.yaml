- date: Juin-Dec 2025
  description: À travers un processus de conception itératif, [Sylvie Grosjean](https://www.uottawa.ca/commtech-innovation-lab/people/grosjean-sylvie) a développé la conversation de CAFY pour aider les utilisateurs à sélectionner leurs priorités en matière d’autosoins. [Nadim Saadeh](https://www.linkedin.com/in/nadim-saadeh/) et l’équipe, notamment [Mae Slabinski](https://www.linkedin.com/in/mae-slabinski-166a412a/) et [Maryse Kavwahirehi](https://www.linkedin.com/in/marysek/), ont créé des conseils de soins allant des niveaux de base aux niveaux avancés, selon une taxonomie composée de cinq catégories. Pour ma part, j’ai travaillé à réunir ces éléments dans un nouveau prototype, constituant un premier parcours utilisateur complet permettant d’identifier les priorités d’autosoins, de suivre les progrès, de visualiser le parcours et d’accéder aux ressources.
