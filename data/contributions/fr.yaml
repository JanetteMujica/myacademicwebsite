- date: Avr 2025
  type: Projet de session
  title: Ember - Un outil d’aide-mémoire pour les personnes vivant avec la maladie de Parkinson
  description: J’ai conçu un prototype d’Ember, un assistant pensé comme un outil d’aide-mémoire pour les personnes vivant avec la maladie de Parkinson. Ember aide les utilisateurs à suivre leurs priorités en matière d’autosoins au moyen d’un chatbot, à visualiser des tendances liées à leur santé et à documenter leurs expériences afin de favoriser l’autosoin et une prise de décision éclairée.
