- date: Jan 2025
  type: Implication
  description: J’ai commencé ma M.Sc. en transformation numérique et innovation.
- date: Mars 2025
  description: 'À partir des résultats de l’étude basée sur un journal de bord, j’ai développé un premier prototype de CAFY, un assistant conçu pour aider les personnes vivant avec la maladie de Parkinson à sélectionner leurs priorités en matière d’autosoins. Intégré à un tableau de bord médical, similaire à la version précédente, le prototype comprend un sélecteur de base des priorités en matière d’autosoins ainsi que WikiPD, la structure de base de connaissances qui servirait de fondement à l’application. [Sylvie Grosjean](https://www.uottawa.ca/commtech-innovation-lab/people/grosjean-sylvie) a présenté les résultats de l’étude basée sur un journal de bord ainsi que cette première itération de CAFY lors de l’événement Destination Recherche et Innovation Montfort.'
  img: 2eCarePD
  title:
    'L’autosoin équipé et alimenté par l’Intelligence Artificielle (IA) : Explorer les usages pour
    créer un « compagnon numérique'
