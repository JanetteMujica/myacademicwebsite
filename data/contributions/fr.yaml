- date: Mai 2025
  type: Création
  title: Refonte de la structure d’e-Care PD
  description: '[Sylvie Grosjean](https://www.uottawa.ca/commtech-innovation-lab/people/grosjean-sylvie), en collaboration avec [Mae Slabinski](https://www.linkedin.com/in/mae-slabinski-166a412a/), [Nadim Saadeh](https://www.linkedin.com/in/nadim-saadeh/) et moi-même, avons restructuré l’application en s’appuyant sur le [*middle range theory* de l’autosoin des maladies chroniques](https://www.ovid.com/jnls/advancesinnursingscience/abstract/10.1097/ans.0b013e318261b1ba~a-middle-range-theory-of-self-care-of-chronic-illness?redirectionsource=fulltextview). La professeure [Fabienne Martin-Juchat](https://www.univ-grenoble-alpes.fr/fabienne-martin-juchat-539593.kjsp), en tant que professeure invitée, a participé à nos séances de travail et a fourni des commentaires sur la conception de l’application.'
