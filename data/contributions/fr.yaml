- date: Avr 2025
  type: Projet de session
  title: Ember - Un outil d’aide-mémoire pour les personnes vivant avec la maladie de Parkinson
  description: Dans le cadre du cours sur les assistants virtuels basés sur l’IA, enseigné par la professeure [Professor Caroline Barrière](https://uniweb.uottawa.ca/network/profile/members/3857), j’ai conçu un prototype d’Ember, un assistant pensé comme un outil d’aide-mémoire pour les personnes vivant avec la maladie de Parkinson. Ember aide les utilisateurs à suivre leurs priorités en matière d’autosoins au moyen d’un chatbot, à visualiser des tendances liées à leur santé et à documenter leurs expériences afin de favoriser l’autosoin et une prise de décision éclairée.
  img: 3e_Ember
  link: https://www.youtube.com/watch?v=Iu58T5tMdtc

- date: Mai 2025
  type: Présentation
  title: CAFY - un assistant virtuel pour mieux vivre avec la maladie de Parkinson
  description: J’ai présenté au laboratoire et au [Dr. Tiago Mestre](https://www.uottawa.ca/faculty-medicine/directory/dr-tiago-mestre) un premier prototype visant à remplacer le tableau de bord médical traditionnel par un parcours utilisateur guidé, à la manière d’un assistant virtuel, pour définir des objectifs d’autosoins, suivre les progrès et visualiser le parcours global. J’ai également intégré une fonctionnalité de synthèse vocale. À la suite de cette présentation, il a été convenu de repenser la plateforme comme une application mobile, en mettant de l’avant l’identité visuelle et les couleurs de [Parkinson Canada](https://www.parkinson.ca/) .
