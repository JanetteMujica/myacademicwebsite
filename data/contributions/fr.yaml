- date: Nov 2024
  type: Implication
  title: Résultats de l’étude d’utilisabilité d’e-Care PD
  description: '[Sylvie Grosjean](https://www.uottawa.ca/commtech-innovation-lab/people/grosjean-sylvie), en collaboration avec [Leylah Alwash](https://www.linkedin.com/in/leyla-alwash-a36245310/) et [Elaine Ho](https://www.linkedin.com/in/elaineho11/), a analysé et présenté les résultats d’une étude d’utilisabilité basée sur un journal de bord portant sur e-Care PD, une application développée par Macadamian Technologies permettant aux personnes vivant avec la maladie de Parkinson de suivre leurs priorités en matière de soins. <br><br> L’étude a mis en évidence la nécessité d’améliorer l’accompagnement des personnes vivant avec la maladie de Parkinson dans l’établissement de leurs objectifs d’autosoins, de renforcer la personnalisation des recommandations et d’améliorer les visualisations de données pour aider à identifier les tendances dans les symptômes.'
  img: 1eCarePD
  institution: Com&Tech Innovations Lab, Université d'Ottawa
