- date: June-Dec 2025
  description:
    Through an iterative design process at the lab, Sylvie Grosjean wrote the CAFY conversation
    to help select self-care priorites, while Nadim Saadeh and the team, including Mae Slabinski and Maryse,
    created care tips ranging from basic to advanced levels of self-care, based on a taxonomy comprising
    five categories. I focused on bringing these elements together into a new prototype a first complete
    user flow, enabling users to identify self-care priorities, track their progress, visualize their
    journey, and access relevant resources.
  img: 7e_CarePD
