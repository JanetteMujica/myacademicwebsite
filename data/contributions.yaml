  type: Creative Output
  description:
    Sylvie Grosjean, together with Mae Slabinski, Nadim Saadeh, and me, restructured the app
    based on a middle-range theory of self-care for chronic conditions. Professor [Fabienne Martin-Juchat](https://www.univ-grenoble-alpes.fr/fabienne-martin-juchat-539593.kjsp), as visiting professor, participated in our working sessions and provided valuable feedback on the design of the app.
