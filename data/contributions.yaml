  description: During the Data Science Applications course taught by [Professor Arya Rahgozar](https://www.uottawa.ca/faculty-engineering/school-engineering-design-teaching-innovation/directory/arya-rahgozar), Wen Qi, Anna Shatlova, and I prototyped CAFY, a self-care conversational recommendation system designed for people living with Parkinson.
