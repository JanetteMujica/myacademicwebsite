- date: Oct 2024
  description:
    I started working as a Research Assistant at Comm&Tech lab directed by [Professor Sylvie Grosjean](https://www.uottawa.ca/commtech-innovation-lab/people/grosjean-sylvie)
    in Fall 2024.

- date: Nov 2024
  description:
    "Sylvie Grosjean, together with [Leylah Alwash](https://www.linkedin.com/in/leyla-alwash-a36245310/) and [Elaine Ho](https://www.linkedin.com/in/elaineho11/), analyzed and presented the results of a diary-based usability study of e-Care PD, an app to track care priorities for people living with Parkinson developed by Macadamian Technologies. The study highlighted the need to improve how people living with Parkinson's disease are supported
    in setting self-care goals, enhance the personalization of recommendations, and improve data visualizations to facilitate self-care and help identify patterns in symptoms."
  img: 1eCarePD
  people:
    - Sylvie Grosjean
    - Leylah Alwash
    - Elaine Ho
- date: Jan 2025
  description: I started my master of Science in Digital Transformation & Innovation
- date: March 2025
  description:
    Based on the results of the diary study, I developed a first prototype of CAFY, an assistant
    designed to help people living with Parkinson’s select self-care priorities. Integrated into a medical
    dashboard, similar to the previous version, the prototype includes a basic self-care priorities selector
    as well as WikiPD, the knowledge base structure that would underpin the app. Sylvie Grosjean presented
    the diary study results and this first iteration of CAFY at Destination Recherche et Innovation Montfort.
  img: 2eCarePD
  title:
    'L’autosoin équipé et alimenté par l’Intelligence Artificielle (IA) : Explorer les usages pour
    créer un « compagnon numérique'
  type: Presentation
  event: Destination Recherche et Innovation Montfort
  location: Hopital Montfort, Ottawa, Canada
  people:
    - Sylvie Grosjean
    - Janette Mujica
    - Nadim Saadeh

- date: Apr 2025
  type: Course project
  description: During the AI Virtual Assistants course taught by [Professor Caroline Barrière](https://uniweb.uottawa.ca/network/profile/members/3857), I prototyped Ember, an assistant designed as a memory aid for people living with Parkinson's. Ember helps users track care priorities through a chatbot, visualize health patterns, and document their experiences to support self-care and informed decision-making.
  img: 3e_Ember
  link: https://www.youtube.com/watch?v=Iu58T5tMdtc

- date: May 2025
  type: Presentation
  description: I presented to the Comm&Tech Innovation Lab, [Dr. Tiago Mestre](https://www.uottawa.ca/faculty-medicine/directory/dr-tiago-mestre) an initial attempt to transition from a traditional medical dashboard toward a task-oriented user flow that guides users, like a virtual assistant, through selecting self-care goals, tracking their progress, and viewing their overall journey. I also integrated a text-to-speech feature. It was agreed that the platformshould be redesigned with the look and feel of a mobile application rather than a website, while redefining its identity with [Parkinson Canada](https://www.parkinson.ca/) colors at the forefront.
  img: 4e_CarePD
  link: https://youtu.be/46uR8cW7a4I
